<title>Studio</title>
<style>
:root {
  --bg: #0b1118; --panel: #141d28; --panel2: #1b2633; --ink: #f2f5f8; --muted: #93a1b0; --line: #243140;
  --blue: #3b82f6; --green: #3ecf8e; --amber: #f5b84d; --red: #ff6b6b; --owb: #f0a35e; --hos: #6eb5ff;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 760px; margin: 0 auto; }
a { color: inherit; text-decoration: none; }
h1 { font-size: 1.7rem; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 1.08rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .n { background: var(--panel2); color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: 0.8rem; font-weight: 600; }
.more { margin-left: auto; color: var(--blue); font-size: 0.9rem; font-weight: 500; }
.more.block { display: block; text-align: center; padding: 10px; }
.meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 0; display: block; }
.empty { color: var(--muted); background: var(--panel); border-radius: var(--radius); padding: 14px; margin: 0; font-size: 0.9rem; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; background: var(--panel2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.green { color: var(--green); } .pill.amber { color: var(--amber); } .pill.red { color: var(--red); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tiles.three { grid-template-columns: repeat(3, 1fr); margin-top: 4px; }
.tile-stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-stat b { font-size: 1.7rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-stat span { color: var(--muted); font-size: 0.85rem; }
b.blue { color: var(--blue); } b.green, .green { color: var(--green); } b.amber { color: var(--amber); } b.red { color: var(--red); }
.row { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .body b { font-size: 0.97rem; line-height: 1.25; }
.chev { color: var(--muted); font-size: 1.4rem; }
.thumb { position: relative; flex: 0 0 104px; height: 59px; border-radius: 10px; overflow: hidden; background: var(--panel2); }
.thumb.job { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.tile { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: #fff; }
.tile { background: linear-gradient(135deg, #1d2b1d, #4f8a4f); } .tile.owb { background: linear-gradient(135deg, #3a1d0b, #b5652a); } .tile.hos { background: linear-gradient(135deg, #0d2340, #3f7fc4); }
.prog { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 0.8rem; color: var(--muted); }
.prog .bar { flex: 1 1 100%; }
.prog b { color: var(--ink); }
.bar { flex: 1; height: 6px; background: #0a0f15; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.bar i.green { background: var(--green); } .bar i.amber { background: var(--amber); } .bar i.red { background: var(--red); }
.tag { align-self: flex-start; font-size: 0.75rem; font-weight: 600; border-radius: 999px; padding: 3px 9px; background: var(--panel2); color: var(--muted); }
.tag.green { background: rgba(62,207,142,.15); color: var(--green); } .tag.amber { background: rgba(245,184,77,.15); color: var(--amber); }
.rcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 4px 10px; margin-bottom: 10px; }
.rcard .row { border: 0; margin: 0; background: none; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px; }
.btn { display: block; text-align: center; border-radius: 12px; padding: 12px; font-weight: 600; background: var(--panel2); }
.btn.primary { background: var(--blue); }
.btn.off { color: var(--muted); }
button.btn { border: 0; color: var(--ink); font: inherit; font-weight: 600; width: 100%; cursor: pointer; }
.btn.watch { margin: 0 8px 8px; background: var(--blue); }
.btn.ok { background: var(--green); color: #05230f; } .btn.chg { background: var(--panel2); color: var(--amber); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 4px; } .sheet textarea { width: 100%; margin: 12px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px; font: inherit; font-size: 16px; }
.sheet .btns { padding: 0; }
#toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; padding: 10px 18px; border-radius: 12px; font-weight: 600; background: #1f7a3a; color: #fff; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; } #toast.bad { background: #b3261e; }
.doing { color: var(--blue); font-size: 0.85rem; font-weight: 500; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
.seg button { border: 0; background: none; color: var(--muted); border-radius: 9px; padding: 9px 4px; font: inherit; font-size: 0.9rem; font-weight: 600; }
.seg button.on { background: var(--panel2); color: var(--ink); }
.seg small { color: var(--muted); font-weight: 500; }
h3.day { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 2px 8px; }
.tag.red { background: rgba(255,107,107,.15); color: var(--red); }
.back { margin-left: 0; font-size: 1rem; }
.uat-title { font-size: 1.35rem; line-height: 1.25; }
.player { margin: 14px 0 10px; }
.player video { width: 100%; max-height: 70vh; border-radius: 14px; background: #000; display: block; }
#uat-notes { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 12px; font: inherit; font-size: 16px; margin-bottom: 8px; }
.btns + .btns { margin-top: 8px; }
.btns.one { grid-template-columns: 1fr; margin-bottom: 8px; }
.mini { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; margin: -6px 0 14px; }
.mini i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: 0 0 8px; }
.mini.on i { background: var(--green); box-shadow: 0 0 8px rgba(62,207,142,.7); }
.hero .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; flex: none; margin-bottom: 12px; border-radius: 14px; }
.hero .tile { font-size: 2.4rem; }
.line { background: var(--panel); border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 0.95rem; line-height: 1.4; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
.job-top { display: flex; gap: 8px; align-items: flex-start; }
.job-top b { font-size: 0.92rem; line-height: 1.3; }
ul.notes { list-style: none; padding: 0; margin: 0; } ul.notes li { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 0.92rem; }
ul.notes li.done { color: var(--muted); text-decoration: line-through; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chips button { border: 0; background: var(--panel2); color: var(--ink); border-radius: 999px; padding: 8px 15px; font-size: 0.9rem; white-space: nowrap; }
.chips button.on { background: var(--blue); font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; background: var(--muted); }
.dot.green { background: var(--green); box-shadow: 0 0 8px rgba(62,207,142,.6); } .dot.amber { background: var(--amber); } .dot.red { background: var(--red); }
.row.agent { padding: 12px; }
.meta.when { color: var(--ink); font-weight: 500; }
.chief-card { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
.chief-card b { font-size: 1.15rem; }
.credits { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.credit { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.credit span { color: var(--muted); font-size: 0.82rem; } .credit b { font-size: 1.35rem; } .credit small { color: var(--muted); }
nav#nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: rgba(14,20,28,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 10; }
nav#nav a { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 0.72rem; }
nav#nav a .ic { font-size: 1.25rem; line-height: 1.2; }
nav#nav a.on { color: var(--blue); }
nav#nav em { position: absolute; top: -4px; left: 55%; font-style: normal; background: var(--red); color: #fff; border-radius: 999px; font-size: 0.68rem; font-weight: 700; padding: 1px 6px; }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, 1fr); } .tiles.three { grid-template-columns: repeat(3, 1fr); } }
/* Studio V2: production first; native disclosures retain the original evidence. */
:root { --bg:#0A1019; --panel:#162231; --panel2:#1B2A3B; --ink:#F3F6FA; --muted:#9EADBE; --line:#29394B; --blue:#438BFF; --green:#38C991; --amber:#F3B84B; --red:#EF6464; --radius:16px; }
body { padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
main, section, .body, .video-heading>div, .stage-copy { min-width:0; }
main { overflow-wrap:anywhere; }
section { margin:24px 0; }
h2 { margin:0 0 12px; }
.muted { color:var(--muted); font-size:.85rem; line-height:1.5; margin:8px 0 0; }
.eyebrow { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:.68rem; font-weight:700; margin:0; }
.top { flex-wrap:wrap; align-items:flex-start; margin-bottom:16px; }
.pill { white-space:normal; max-width:100%; }
a.back { min-height:44px; display:inline-flex; align-items:center; }
.video-heading { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
.video-heading .thumb { flex:0 0 88px; width:88px; height:64px; border-radius:12px; }
.video-heading .uat-title { font-size:1.15rem; line-height:1.3; margin:0 0 4px; }
.video-heading .meta { font-size:.76rem; line-height:1.5; }
.progress-hero { border:1px solid var(--line); background:linear-gradient(135deg,var(--panel2),var(--panel)); border-radius:18px; padding:20px; }
.progress-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.progress-number { font-size:2.75rem; font-weight:750; letter-spacing:-.05em; line-height:1; }
.progress-number span { font-size:1.2rem; color:var(--muted); margin-left:3px; }
.milestone-caption { font-size:1rem; margin:12px 0; }
.hero-track,.track { background:#0A1019; border-radius:999px; height:8px; overflow:hidden; }
.hero-track i,.track i { background:var(--blue); height:100%; display:block; border-radius:inherit; }
.progress-note { font-size:.72rem; margin-top:8px; }
.forecast-block { border-top:1px solid var(--line); margin-top:20px; padding-top:16px; display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.forecast-block b { display:block; margin-top:6px; font-size:1.25rem; letter-spacing:-.025em; }
.confidence { color:var(--muted); font-size:.75rem; }
.partial-estimate { font-size:.85rem; line-height:1.5; border-left:2px solid var(--blue); padding-left:12px; }
.current-stage { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.stage-more { display:flex; align-items:center; gap:8px; min-height:44px; padding:8px 0; color:var(--blue); background:none; border:0; font:inherit; cursor:pointer; }
.milestone-card { scroll-margin-top:calc(env(safe-area-inset-top, 0px) + 16px); }
.current-stage h2 { font-size:1.2rem; margin:8px 0 12px; }
.current-stage p { font-size:.9rem; line-height:1.5; }
.stage-status { display:flex; align-items:center; gap:8px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:0 0 7px; }
.status-dot.active { background:var(--blue); }.status-dot.held { background:var(--amber); }
.next-action { padding:12px; background:var(--bg); border-radius:10px; font-size:.85rem; line-height:1.5; margin:12px 0; }
.next-action>span { color:var(--muted); display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
.stage-strip { display:grid; grid-template-columns:repeat(9,1fr); gap:4px; margin-bottom:16px; }
.stage-strip i { height:4px; border-radius:4px; background:var(--line); }
.stage-strip .complete { background:var(--green); }.stage-strip .active { background:var(--blue); }.stage-strip .held { background:var(--amber); }
.milestone-card { border:1px solid var(--line); border-radius:14px; background:var(--panel); margin-bottom:8px; scroll-margin-top:16px; }
summary { cursor:pointer; min-height:44px; }
.milestone-card>summary { display:flex; align-items:center; padding:14px; gap:12px; min-height:68px; list-style:none; }
summary::-webkit-details-marker { display:none; }
.milestone-card>summary::marker { content:''; }
.stage-icon { display:flex; align-items:center; justify-content:center; color:var(--muted); border:1px solid var(--line); width:28px; height:28px; border-radius:50%; flex:0 0 28px; font-size:.85rem; }
.complete .stage-icon { color:var(--green); border-color:#275548; }.held .stage-icon { color:var(--amber); border-color:#695637; }.active .stage-icon { color:var(--blue); border-color:#325583; }
.stage-copy { display:flex; flex:1; flex-direction:column; gap:4px; }
.stage-copy b { font-size:.95rem; }.stage-copy small { color:var(--muted); line-height:1.45; font-size:.76rem; }
.expand-icon { color:var(--muted); transition:transform .15s ease; }.milestone-card[open]>summary .expand-icon { transform:rotate(180deg); }
.stage-explanation p { margin:4px 0 12px; overflow-wrap:anywhere; }
.stage-explanation p:last-child { margin-bottom:0; }
.stage-expanded { padding:0 14px 14px; border-top:1px solid var(--line); }
.stage-facts { margin:12px 0; font-size:.8rem; }.stage-facts>div { display:flex; justify-content:space-between; gap:16px; margin:8px 0; }.stage-facts dt { color:var(--muted); }.stage-facts dd { margin:0; text-align:right; }
.technical { margin-top:8px; }.technical>summary { color:var(--muted); font-size:.8rem; display:flex; align-items:center; gap:8px; }.technical>summary::before { content:'＋'; }.technical[open]>summary::before { content:'−'; }
.technical-body { color:var(--muted); font-size:.78rem; line-height:1.55; overflow-wrap:anywhere; word-break:break-word; padding:8px 0; }.technical-body p { white-space:pre-wrap; }
.tech-fields { margin:0; }.tech-fields>div { margin:8px 0; }.tech-fields dt { font-weight:650; }.tech-fields dd { margin:2px 0 8px; white-space:pre-wrap; }
.video-technical { border:1px solid var(--line); padding:8px 16px; border-radius:14px; background:var(--panel); }.video-technical>summary { justify-content:space-between; }
.other-stages summary { color:var(--blue); display:flex; align-items:center; font-size:.85rem; }.other-stage { display:flex; align-items:center; min-height:44px; font-size:.85rem; }
.milestone-mini { margin:8px 0 4px; font-size:.75rem; }.milestone-mini .track { height:4px; margin-bottom:6px; }.milestone-mini .muted { font-size:inherit; }
.production-card { margin:8px 0; background:var(--panel); border-radius:16px; border:1px solid var(--line); }.production-card .thumb { flex:0 0 56px; width:56px; height:44px; }
.production-card>.row { align-items:flex-start; border:0; margin:0; background:none; padding:16px; }
.blocking-action { color:var(--muted); margin:0 16px 16px; padding-top:12px; border-top:1px solid var(--line); font-size:.8rem; line-height:1.5; }
.blocked-word { color:var(--amber); }.current-label { font-size:.78rem; }.outlook-line { color:var(--ink); font-size:.8rem; margin-top:6px; }.ranking-note { font-size:.72rem; line-height:1.5; }
.pipeline-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid var(--line); border-radius:16px; background:var(--panel); }
.pipeline-grid>a { display:flex; flex-direction:column; padding:16px 8px; align-items:center; gap:4px; min-height:44px; }.pipeline-grid b { font-size:1.6rem; }.pipeline-grid span { color:var(--muted); font-size:.75rem; }
.sort-control { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--muted); margin:16px 0; }.sort-control select { max-width:70%; min-height:44px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; padding:8px; }
.chips button,.seg button { min-height:44px; }.more { display:inline-flex; align-items:center; min-height:44px; }.row { min-height:64px; }
nav#nav { padding:8px 4px calc(8px + env(safe-area-inset-bottom)); }.btns { padding:0; }nav#nav a { min-height:44px; justify-content:center; }
:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
@media(min-width:700px) { .progress-hero { padding:24px; }.video-heading .thumb { flex-basis:112px; width:112px; height:72px; }.milestone-timeline { max-width:760px; } }
@media(prefers-reduced-motion:reduce) { * { transition:none!important; scroll-behavior:auto!important; } }

/* Studio V3 Overview — simple card stack (Ben, 6 Nov 2026).
   One subject per card; only the facts that matter; wrap useful text. Scoped to .overview-home. */
.overview-home { --overview-gap:12px; display:flex; flex-direction:column; gap:var(--overview-gap); }
.overview-home .ov-card {
  display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
}
.overview-home .ov-stack { display:flex; flex-direction:column; gap:10px; }
.overview-header { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; margin:0; }
.overview-header>div { min-width:0; flex:1; }
.overview-header h1 { font-size:28px; line-height:1.15; letter-spacing:-.02em; }
.overview-header>div>p { color:var(--muted); font-size:12px; line-height:1.45; margin:6px 0 0; }
.operation-status { display:inline-flex; align-items:center; gap:6px; flex:0 1 auto; min-height:44px; max-width:45%; font-size:12px; line-height:1.4; text-align:left; font-weight:600; }
.operation-status i { width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:currentColor; }
.operation-status.green { color:var(--green); }.operation-status.amber { color:var(--amber); }.operation-status.red { color:var(--red); }
.overview-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:0; }
.overview-stats>a.ov-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:72px; padding:12px 8px; text-align:center; }
.overview-stats b { font-size:28px; line-height:1.05; font-weight:700; letter-spacing:-.02em; }
.overview-stats span { color:var(--muted); font-size:11px; line-height:1.3; }
.overview-home section { margin:0; }
.overview-home h2 { font-size:12px; font-weight:600; line-height:1.3; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.featured-video { /* uses .ov-card look via shared panel styles; keep class for tests */ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.overview-home .featured-video { display:block; }
.featured-heading { display:flex; align-items:center; gap:12px; }
.featured-heading .thumb { width:64px; height:48px; flex:0 0 64px; border-radius:10px; }

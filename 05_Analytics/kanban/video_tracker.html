<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Studio · videos</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a222c;
  --panel2: #222c38;
  --ink: #f2f5f8;
  --muted: #9aa7b5;
  --line: #2c3846;
  --orbit: #f0a35e;
  --hos: #6eb5ff;
  --flag: #ff6b6b;
  --ok: #3ecf8e;
  --ready: #f5d76e;
  --changes: #ff9f6b;
  --approved: #7dd3fc;
  --radius: 14px;
  --pad: 14px;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
a { color: var(--hos); }
header { margin-bottom: 14px; }
header h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.02em; }
header .sub { color: var(--muted); font-size: 0.85rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.filters button {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; min-height: 40px;
}
.filters button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.board {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding-bottom: 8px; -webkit-overflow-scrolling: touch;
}
.lane {
  flex: 0 0 min(86vw, 320px); min-width: 0; scroll-snap-align: start;
  overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; max-height: calc(100vh - 160px);
}
.lane h2 {
  margin: 0; padding: 12px var(--pad) 8px; font-size: 0.95rem;
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1;
}
.lane h2 .n { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
.lane[data-lane="changes"] h2 { color: var(--changes); }
.lane[data-lane="ready"] h2 { color: var(--ready); }
.lane[data-lane="approved"] h2 { color: var(--approved); }
.appr { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: rgba(125,211,252,0.08); border: 1px solid rgba(125,211,252,0.25); font-size: 0.85rem; }
.appr .appr-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.appr .appr-state { font-weight: 700; color: var(--approved); }
.appr .appr-line { margin-top: 4px; color: var(--ink); }
.appr .appr-bar { margin-top: 6px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.appr .appr-bar span { display: block; height: 100%; background: var(--approved); }
.appr details { margin-top: 8px; }
.appr summary { cursor: pointer; color: var(--hos); }
.appr .decision-text { margin: 8px 0 0; line-height: 1.4; }
.appr .mono { font-family: ui-monospace, Menlo, monospace; }
.appr.warn { background: rgba(255,107,107,0.10); border-color: var(--flag); }
.appr.warn .appr-state { color: var(--flag); }
.lane[data-lane="done"] h2 { color: var(--ok); }
.lane-summary { font-size: .8rem; color: var(--muted); margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.cards { min-width: 0; padding: 10px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
  min-width: 0; overflow-wrap: anywhere;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.card.flagged { border-color: var(--flag); box-shadow: inset 0 0 0 1px rgba(255,107,107,0.25); }
.top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px;
}
.badge.orbit { background: rgba(240,163,94,0.2); color: var(--orbit); }
.badge.hos { background: rgba(110,181,255,0.18); color: var(--hos); }
.badge.type { background: rgba(255,255,255,0.08); color: var(--muted); }
.badge.ver { background: rgba(255,255,255,0.06); color: var(--ink); }
.title { font-size: 1.05rem; font-weight: 650; line-height: 1.25; margin: 0; }
.title .num { color: var(--muted); font-weight: 600; margin-right: 4px; }
.line { margin: 0; font-size: 0.92rem; line-height: 1.35; color: var(--ink); }
.meta { margin: 0; font-size: 0.8rem; color: var(--muted); }
.flags { display: flex; flex-direction: column; gap: 4px; }
.flag {
  background: rgba(255,107,107,0.15); color: #ffc9c9; border-radius: 8px;
  padding: 6px 8px; font-size: 0.82rem; font-weight: 600;
}
.okline {
  background: rgba(62,207,142,0.12); color: #bff0d8; border-radius: 8px;
  padding: 6px 8px; font-size: 0.82rem; font-weight: 600;
}
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li {
  display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; line-height: 1.3;
  background: rgba(0,0,0,0.2); border-radius: 8px; padding: 8px;
}
.notes .box {
  flex: 0 0 18px; height: 18px; margin-top: 1px; border: 2px solid var(--muted); border-radius: 4px;
}
.notes li.done .box { background: var(--ok); border-color: var(--ok); }
.notes li.done { opacity: 0.65; text-decoration: line-through; }
.notes .t { color: var(--changes); font-weight: 700; margin-right: 4px; white-space: nowrap; }
.ready-tag {
  display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 4px 8px;
  border-radius: 6px; background: rgba(245,215,110,0.18); color: var(--ready);
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.actions button, .actions a.btn {
  flex: 1 1 auto; min-height: 44px; border-radius: 10px; border: none;
  font-size: 0.95rem; font-weight: 650; padding: 10px 12px; text-align: center;
  text-decoration: none; cursor: pointer;
}
.actions .ok { background: var(--ok); color: #062414; }
.actions .chg { background: var(--changes); color: #2a1200; }
.actions .watch, .actions .yt { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.collapsed-toggle {
  margin: 4px 10px 10px; border: 1px dashed var(--line); background: transparent;
  color: var(--muted); border-radius: 8px; padding: 8px; font-size: 0.85rem;
}
.empty { color: var(--muted); font-size: 0.9rem; padding: 16px 8px; text-align: center; }
.strip { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 0 0 12px; display: flex; flex-direction: column; gap: 10px; }
.strip h2 { margin: 0; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.strip .row { display: flex; flex-direction: column; gap: 8px; }
.models { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mchip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 10px; font-size: 0.85rem; font-weight: 650; border: 1px solid var(--line); background: var(--panel2); }
.mchip .dot { font-weight: 800; }
.mchip.green { border-color: rgba(62,207,142,0.5); } .mchip.green .dot { color: var(--ok); }
.mchip.red { border-color: rgba(255,107,107,0.6); } .mchip.red .dot { color: var(--flag); }
.mchip.amber { border-color: rgba(245,215,110,0.5); } .mchip.amber .dot { color: var(--ready); }
.mmeta { color: var(--muted); font-size: 0.8rem; }
.mmeta b { color: var(--ink); }
.job { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.job.now { border-color: rgba(110,181,255,0.55); }
.job .jtop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.job .jid { font-weight: 700; color: var(--ink); }
.job .jfilm { font-weight: 650; font-size: 0.98rem; line-height: 1.25; }
.job .jtask { font-size: 0.88rem; line-height: 1.3; }
.job .jnote { font-size: 0.8rem; color: var(--muted); }
.bar { height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: var(--hos); border-radius: 999px; transition: width .4s; }
.bar.low > i { background: #ff7a45; } .bar.mid > i { background: #f5c542; } .bar.high > i { background: var(--ok); }
.bar.over > i { background: #b388ff; }
.actions .btn.play { flex: 1 1 100%; min-height: 52px; font-size: 1.05rem; background: var(--hos); color: #04121f; display: flex; align-items: center; justify-content: center; }
.actions .btn.play.yt { background: #ff4e45; color: #fff; }
.actions .btn.play.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 600; cursor: default; }
.nextlist { display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 900px) {
  .strip .row.jobs { flex-direction: row; } .strip .row.jobs > * { flex: 1 1 0; min-width: 0; }
}
.activity { margin-bottom: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.activity h2 { margin: 0 0 10px; font-size: 1rem; }
.activity-counts { display: flex; flex-wrap: wrap; gap: 8px; }
.activity-counts span { background: var(--panel2); border-radius: 8px; padding: 8px 12px; font-size: .85rem; }
.activity-counts b { font-size: 1.1rem; }
.activity details, .card-work details { margin-top: 10px; }
.activity summary, .card-work summary { cursor: pointer; color: var(--hos); font-size: .85rem; padding: 7px 0; }
.activity details[open] { max-height: 420px; overflow: auto; }
.task-row { padding: 10px 0; border-top: 1px solid var(--line); font-size: .85rem; line-height: 1.4; overflow-wrap: anywhere; }
.task-row b { display: block; margin-bottom: 4px; }
.block-reason { margin: 6px 0; color: #f5d8a2; }
.card-work { border-top: 1px solid var(--line); padding-top: 10px; font-size: .85rem; }
.remaining-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.remaining-list li { padding-left: 13px; border-left: 2px solid var(--line); }
.task-action { display: block; line-height: 1.35; }
.task-status { display: block; margin-top: 3px; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.remaining-list .job { padding: 0; border: 0; background: transparent; }
.card-work > .job { margin: 8px 0; }
.last-result { margin-top: 8px; color: #bff0d8; font-size: .8rem; }
footer { margin-top: 16px; color: var(--muted); font-size: 0.8rem; }
footer a { color: inherit; }
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex;
  align-items: flex-end; justify-content: center; z-index: 20; padding: 16px;
}
.modal {
  background: var(--panel); border-radius: 16px 16px 12px 12px; width: min(480px, 100%);
  padding: 16px; border: 1px solid var(--line);
}
.modal h3 { margin: 0 0 8px; }
.modal textarea {
  width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px; font: inherit;
}
.modal .row { display: flex; gap: 8px; margin-top: 10px; }
@media (min-width: 900px) {
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: visible; }
  .lane { flex: none; max-height: calc(100vh - 140px); min-width: 0; }
}
/* Compact activity header; expand services and detailed updates only when needed. */
.strip .row.jobs { gap: 12px; }
.strip .job { background: transparent; border: 0; padding: 0; gap: 7px; }
.strip .job .jfilm { display: none; }
.strip .job .jtask { font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.strip .bar { height: 6px; }
.strip .jnote { font-size: .75rem; }
.services { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: .75rem; color: var(--muted); }
.services > summary { cursor: pointer; }
.services > summary span { margin-left: 8px; }
.services .models { margin-top: 10px; }
.job-detail { margin-top: 5px; line-height: 1.4; }
.job-detail summary { cursor: pointer; color: var(--muted); }
.live-dot { display: inline-block; width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--ok); animation: live-pulse 1.8s ease-in-out infinite; }
.active-task { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: .72rem; width: 100%; }
.bar.indeterminate > i { width: 28%; animation: progress-sweep 1.8s ease-in-out infinite; }
@keyframes live-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(62,207,142,.3); opacity: 1; } 50% { box-shadow: 0 0 0 5px rgba(62,207,142,0); opacity: .55; } }
@keyframes progress-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(460%); } }
@media (prefers-reduced-motion: reduce) { .live-dot, .bar.indeterminate > i { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Studio videos</h1>
  <div class="sub" id="asof">Loading…</div>
  <div class="filters" id="filters"></div>
</header>
<section class="strip" id="strip" aria-label="Now working"></section>
<section class="activity" id="activity" aria-label="Studio job activity"></section>
<div class="board" id="board"></div>
<footer>
  One card per video. Classic board: <a href="/classic">/classic</a> ·
  <a href="/tracker">Channel Tracker</a>
</footer>
<script>
/* VIDEO_TRACKER_BOOT */
</script>
</body>
</html>

<title>Channel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a mission-log panel. Channel tabs, then the readout (totals and growth), the daily trace, period totals, and every video in a sortable log. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --grid: #eceef2;
  --ink: #12151b; --ink-2: #4b5260; --ink-3: #7a8190;
  --owb: #2a78d6; --hos: #eb6834; --accent: var(--owb);
  --up: #0f7a2e; --down: #c23434; --chip: #eef1f5;
  --f-display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111318; --panel: #181b21; --line: #2a2f38; --grid: #23272f;
  --ink: #f2f4f7; --ink-2: #b5bcc8; --ink-3: #868e9c;
  --owb: #3987e5; --hos: #d95926; --up: #4cc26e; --down: #ff7a7a; --chip: #232832; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111318; --panel: #181b21; --line: #2a2f38; --grid: #23272f;
  --ink: #f2f4f7; --ink-2: #b5bcc8; --ink-3: #868e9c;
  --owb: #3987e5; --hos: #d95926; --up: #4cc26e; --down: #ff7a7a; --chip: #232832; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.1rem; }
.eyebrow { font: 500 .72rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.stamp { color: var(--ink-3); font-size: .82rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 600 .95rem var(--f-display); letter-spacing: .02em; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); padding: 7px 14px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink-3); }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.readout { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cell { background: var(--panel); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
@media (max-width: 720px) { .readout { grid-template-columns: 1fr 1fr; } .readout .cell:last-child { grid-column: 1 / -1; } }
.cell .big { font: 500 1.55rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.cell .sub { font-size: .8rem; color: var(--ink-3); }
.delta { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 .82rem var(--f-body); background: transparent; color: var(--ink-2); border: 0; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 400 11px var(--f-mono); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: .8rem; box-shadow: 0 4px 14px rgb(0 0 0 / .12); white-space: nowrap; z-index: 2; }
.tip b { font-family: var(--f-mono); font-weight: 500; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); position: sticky; top: 0; background: var(--panel); }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--accent); }
td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.l, th.l { text-align: left; }
td.title { font-family: var(--f-body); white-space: normal; min-width: 220px; max-width: 420px; }
td.title a { color: var(--ink); text-decoration: none; }
td.title a:hover { text-decoration: underline; }
.pill { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; background: var(--chip); color: var(--ink-2); }
.pill.long { color: var(--accent); }
input[type="search"] { font: 400 .85rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; width: 220px; max-width: 100%; }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: .82rem; display: grid; gap: 4px; max-width: 75ch; }
.empty { color: var(--ink-3); padding: 20px 0; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.compare .cmp { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.compare .cmp .big { font: 500 1.25rem/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.compare .cmp .sub { font-size: .8rem; color: var(--ink-3); }
.pctcell { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
@media (prefers-reduced-motion: no-preference) { .tab, .seg button { transition: background .15s, color .15s; } }
</style>

<div class="wrap">
  <header>
    <div style="display:grid;gap:4px">
      <span class="eyebrow">YouTube · daily snapshot</span>
      <h1>Channel Tracker</h1>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <div class="stamp" id="stamp"></div>
  <section class="readout" id="readout" aria-label="Totals and growth"></section>

  <section class="panel" aria-labelledby="daily-h">
    <div class="row">
      <h2 id="daily-h">Views per day</h2>
      <div class="seg" id="range">
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90" aria-pressed="true">90 days</button>
        <button type="button" data-days="0">All</button>
      </div>
    </div>
    <div class="chart" id="daily"></div>
  </section>

  <section class="panel" aria-labelledby="period-h">
    <div class="row">
      <h2 id="period-h">Growth by period</h2>
      <div class="seg" id="period">
        <button type="button" data-p="weekly" aria-pressed="true">Week on week</button>
        <button type="button" data-p="monthly">Month on month</button>
      </div>
    </div>
    <div class="compare" id="periodCompare"></div>
    <div class="chart" id="periodChart"></div>
    <div class="scroll"><table id="periodTable"></table></div>
  </section>

  <section class="panel" aria-labelledby="sources-h" id="sourcesPanel" hidden>
    <h2 id="sources-h">Where views come from <span class="stamp">last 28 days</span></h2>
    <div class="scroll"><table id="sourcesTable"></table></div>
  </section>

  <section class="panel" aria-labelledby="videos-h">
    <div class="row">
      <h2 id="videos-h">Every video</h2>
      <div class="row" style="justify-content:flex-end">
        <div class="seg" id="fmt">
          <button type="button" data-f="all" aria-pressed="true">All</button>
          <button type="button" data-f="short">Shorts</button>
          <button type="button" data-f="long">Longs</button>
        </div>
        <input type="search" id="q" placeholder="Search titles" aria-label="Search titles">
      </div>
    </div>
    <div class="scroll" style="max-height:640px"><table id="videos"></table></div>
  </section>

  <section class="panel" aria-labelledby="notes-h">
    <h2 id="notes-h">About these numbers</h2>
    <ul class="notes" id="notes"></ul>
  </section>
</div>

<script id="tracker-data" type="application/json">__TRACKER_DATA__</script>
<script>
(() => {
  let DATA = { channels: [] };
  try { DATA = JSON.parse(document.getElementById("tracker-data").textContent); } catch (e) { /* template without data */ }
  const $ = (id) => document.getElementById(id);
  const fmt = (x) => (x == null ? "–" : Math.round(x).toLocaleString("en-GB"));
  const signed = (x) => (x == null ? "–" : (x > 0 ? "+" : "") + Math.round(x).toLocaleString("en-GB"));
  const cls = (x) => (x == null || x === 0 ? "flat" : x > 0 ? "up" : "down");
  const hrs = (m) => (m == null ? "–" : (m / 60).toLocaleString("en-GB", { maximumFractionDigits: 1 }));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const dayLabel = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const monthLabel = (m) => new Date(m + "-15T12:00:00Z").toLocaleDateString("en-GB", { month: "short", year: "2-digit" });
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  const state = { ch: store.get("tracker.ch") || (DATA.channels[0] && DATA.channels[0].channel), days: 90, period: "weekly", f: "all", q: "", sort: "publishedAt", dir: -1 };
  if (!DATA.channels.some((c) => c.channel === state.ch) && DATA.channels[0]) state.ch = DATA.channels[0].channel;
  const cur = () => DATA.channels.find((c) => c.channel === state.ch);
  const colorVar = (key) => (key === "hos" ? "var(--hos)" : "var(--owb)");

  if (!DATA.channels.length) {
    $("readout").innerHTML = '<div class="cell"><div class="empty">No snapshots yet. The first one lands after the Mac mini runs <span class="num">npm run analytics:snapshot</span>.</div></div>';
    return;
  }

  // ---------------------------------------------------------------- tabs
  function drawTabs() {
    $("tabs").innerHTML = DATA.channels.map((c) =>
      `<button class="tab" role="tab" aria-selected="${c.channel === state.ch}" data-ch="${c.channel}"><span class="dot" style="background:${colorVar(c.channel)}"></span>${esc(c.name)}</button>`).join("");
  }
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-ch]"); if (!b) return; state.ch = b.dataset.ch; store.set("tracker.ch", state.ch); render(); });

  // ---------------------------------------------------------------- readout
  function drawReadout(c) {
    document.documentElement.style.setProperty("--accent", colorVar(c.channel));
    const ch = c.change;
    const growth = (label, x) => `<div class="cell"><span class="eyebrow">${label}</span><span class="big delta ${cls(x && x.views)}">${signed(x && x.views)}</span><span class="sub">views · <span class="delta ${cls(x && x.subscribers)}">${signed(x && x.subscribers)}</span> subs${x && x.source === "analytics" ? " · YT Analytics" : ""}</span></div>`;
    $("readout").innerHTML =
      `<div class="cell"><span class="eyebrow">Subscribers</span><span class="big">${fmt(c.totals.subscribers)}</span><span class="sub">${esc(c.handle)}</span></div>` +
      `<div class="cell"><span class="eyebrow">Total views</span><span class="big">${fmt(c.totals.views)}</span><span class="sub">${c.totals.videos} videos</span></div>` +
      growth("Last day", ch.d1) + growth("Last 7 days", ch.d7) + growth("Last 30 days", ch.d30);
    $("stamp").textContent = `Snapshot ${c.date}` + (c.analyticsThrough ? ` · YouTube Analytics through ${c.analyticsThrough}` : "") + ` · tracking since ${c.firstSnapshot}`;
  }

  // ---------------------------------------------------------------- charts
  let W = 1000, H = 260;
  const PAD = { l: 52, r: 14, t: 12, b: 26 };
  // Draw at the container's real width, so axis text stays 11px on a phone.
  function size(box) { W = Math.max(box.clientWidth || 1000, 300); H = W < 600 ? 200 : 260; }
  function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function axis(max) {
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = PAD.t + (H - PAD.t - PAD.b) * (1 - i / 4);
      g += `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${PAD.l - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`;
    }
    return g;
  }
  function tipAt(box, html, x, y) {
    let t = box.querySelector(".tip");
    if (!t) { t = document.createElement("div"); t.className = "tip"; box.appendChild(t); }
    t.innerHTML = html; t.hidden = false;
    const bw = box.clientWidth, tw = t.offsetWidth;
    t.style.left = Math.min(Math.max(x - tw / 2, 0), bw - tw) + "px";
    t.style.top = Math.max(y - t.offsetHeight - 12, 0) + "px";
  }
  function hideTip(box) { const t = box.querySelector(".tip"); if (t) t.hidden = true; }

  function drawDaily(c) {
    const box = $("daily");
    size(box);
    let rows = c.daily;
    if (state.days) rows = rows.slice(-state.days);
    if (rows.length < 2) { box.innerHTML = '<div class="empty">The daily trace starts once there are two days of data.</div>'; return; }
    const max = niceMax(Math.max(...rows.map((r) => r.views)));
    const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
    const x = (i) => PAD.l + (iw * i) / (rows.length - 1), y = (v) => PAD.t + ih * (1 - v / max);
    const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(Math.max(r.views, 0)).toFixed(1)}`);
    const step = Math.ceil(rows.length / (W < 600 ? 3 : 6));
    let labels = "";
    rows.forEach((r, i) => { if (i % step === 0 || i === rows.length - 1) labels += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === rows.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${dayLabel(r.day)}</text>`; });
    const last = rows[rows.length - 1];
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Views per day, ${rows.length} days">
      ${axis(max)}
      <path d="M${PAD.l},${PAD.t + ih} L${pts.join(" L")} L${x(rows.length - 1)},${PAD.t + ih} Z" fill="${colorVar(c.channel)}" fill-opacity=".12"/>
      <polyline points="${pts.join(" ")}" fill="none" stroke="${colorVar(c.channel)}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(rows.length - 1)}" cy="${y(last.views)}" r="4" fill="${colorVar(c.channel)}" stroke="var(--panel)" stroke-width="2"/>
      <line id="xh" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t + ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="xd" r="4" fill="${colorVar(c.channel)}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
      ${labels}
      <rect x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
    </svg>`;
    const svg = box.querySelector("svg"), xh = svg.querySelector("#xh"), xd = svg.querySelector("#xd");
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * W;
      const i = Math.min(Math.max(Math.round(((sx - PAD.l) / iw) * (rows.length - 1)), 0), rows.length - 1);
      const d = rows[i];
      xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
      xd.setAttribute("cx", x(i)); xd.setAttribute("cy", y(Math.max(d.views, 0))); xd.setAttribute("visibility", "visible");
      const px = (x(i) / W) * r.width, py = (y(Math.max(d.views, 0)) / H) * r.height;
      tipAt(box, `${new Date(d.day + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}<br><b>${fmt(d.views)}</b> views` +
        (d.minutes != null ? ` · <b>${hrs(d.minutes)}</b> h watched` : "") + (d.subsNet != null ? ` · <b>${signed(d.subsNet)}</b> subs` : ""), px, py);
    };
    const hit = svg.querySelector("#hit");
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); xd.setAttribute("visibility", "hidden"); hideTip(box); });
  }

  // Percentages round to whole numbers; anything that rounds to 0 reads as a flat "0%", never "-0%".
  const pctTxt = (x) => { if (x == null) return "–"; const v = Math.round(x); return (v > 0 ? "+" : "") + (v === 0 ? 0 : v).toLocaleString("en-GB") + "%"; };
  const pcls = (x) => cls(x == null ? null : Math.round(x));
  const periodName = (r, weekly) => (weekly ? "Week of " + dayLabel(r.period) : monthLabel(r.period));
  function drawCompare(c) {
    const weekly = state.period === "weekly";
    const rows = weekly ? c.weekly : c.monthly;
    const full = rows.filter((r) => !r.partial);
    const last = full[full.length - 1], running = rows[rows.length - 1];
    const unit = weekly ? "week" : "month";
    const card = (title, r, vs) => r ? `<div class="cmp"><span class="eyebrow">${title}</span>
      <span class="big"><span class="delta ${pcls(r.viewsPct)}">${pctTxt(r.viewsPct)}</span> views</span>
      <span class="sub">${fmt(r.views)} views${r.prev ? " vs " + fmt(r.prev.views) : ""} ${vs} · watch time <span class="delta ${pcls(r.hoursPct)}">${pctTxt(r.hoursPct)}</span> · ${signed(r.subsNet)} subs</span></div>` : "";
    let html = card(`Last full ${unit}: ${periodName(last || {}, weekly)}`, last, `the ${unit} before`);
    if (running && running.partial && running.likeForLike) {
      const n = Math.round((Date.parse(running.to) - Date.parse(running.from)) / 864e5) + 1;
      html += card(`This ${unit} so far (${n} day${n === 1 ? "" : "s"})`, running, `the same ${n} day${n === 1 ? "" : "s"} last ${unit}`);
    }
    $("periodCompare").innerHTML = html || '<div class="empty">Week-on-week and month-on-month change start once there are two full periods.</div>';
  }

  function drawPeriod(c) {
    drawCompare(c);
    const weekly = state.period === "weekly";
    const rows = weekly ? c.weekly.slice(-16) : c.monthly;
    const box = $("periodChart");
    size(box);
    const label = (p) => (weekly ? dayLabel(p) : monthLabel(p));
    if (!rows.length) { box.innerHTML = '<div class="empty">No completed periods yet.</div>'; $("periodTable").innerHTML = ""; return; }
    const max = niceMax(Math.max(...rows.map((r) => r.views)));
    const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b, n = rows.length;
    const slot = iw / n, bw = Math.max(Math.min(slot - 2, 46), 3);
    const step = Math.ceil(n / (W < 600 ? 4 : 8));
    let bars = "", labels = "";
    rows.forEach((r, i) => {
      const h = (ih * Math.max(r.views, 0)) / max, bx = PAD.l + slot * i + (slot - bw) / 2, by = PAD.t + ih - h;
      const rad = Math.min(4, bw / 2, h);
      // A period still running (or the launch part-period) is drawn lighter so it isn't read as a drop.
      bars += `<path data-i="${i}" d="M${bx},${PAD.t + ih} V${by + rad} Q${bx},${by} ${bx + rad},${by} H${bx + bw - rad} Q${bx + bw},${by} ${bx + bw},${by + rad} V${PAD.t + ih} Z" fill="${colorVar(c.channel)}" fill-opacity="${r.partial ? 0.35 : 1}"/>`;
      bars += `<rect data-i="${i}" x="${PAD.l + slot * i}" y="${PAD.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
      if (i % step === 0 || i === n - 1) labels += `<text x="${bx + bw / 2}" y="${H - 6}" text-anchor="middle">${label(r.period)}</text>`;
    });
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Views by ${weekly ? "week" : "month"}">${axis(max)}${bars}${labels}</svg>`;
    const svg = box.querySelector("svg");
    svg.addEventListener("pointermove", (ev) => {
      const el = ev.target.closest("[data-i]"); if (!el) return hideTip(box);
      const r = rows[+el.dataset.i], s = svg.getBoundingClientRect();
      const px = ((PAD.l + slot * (+el.dataset.i + 0.5)) / W) * s.width, py = ((PAD.t + ih * (1 - r.views / max)) / H) * s.height;
      tipAt(box, `${periodName(r, weekly)}${r.partial ? (r.likeForLike ? " (so far)" : " (part)") : ""}<br><b>${fmt(r.views)}</b> views (<b>${pctTxt(r.viewsPct)}</b>) · <b>${hrs(r.minutes)}</b> h (<b>${pctTxt(r.hoursPct)}</b>) · <b>${signed(r.subsNet)}</b> subs · ${r.uploads} uploads`, px, py);
    });
    svg.addEventListener("pointerleave", () => hideTip(box));
    const head = weekly ? "Week of" : "Month";
    $("periodTable").innerHTML = `<thead><tr><th class="l">${head}</th><th>Views</th><th>vs previous</th><th>Watch hours</th><th>vs previous</th><th>Subscribers</th><th>Uploads</th></tr></thead><tbody>` +
      [...rows].reverse().map((r) => `<tr><td class="l">${r.period}${r.partial ? (r.likeForLike ? " · so far" : " · part") : ""}</td><td>${fmt(r.views)}</td><td class="pctcell delta ${pcls(r.viewsPct)}">${pctTxt(r.viewsPct)}</td><td>${hrs(r.minutes)}</td><td class="pctcell delta ${pcls(r.hoursPct)}">${pctTxt(r.hoursPct)}</td><td class="delta ${cls(r.subsNet)}">${signed(r.subsNet)}</td><td>${r.uploads}</td></tr>`).join("") + "</tbody>";
  }


  // ---------------------------------------------------------------- sources
  function drawSources(c) {
    const panel = $("sourcesPanel"), mix = c.sourceMix;
    panel.hidden = !mix;
    if (!mix) return;
    const tot = (m) => Object.values(m).reduce((a, b) => a + b, 0);
    const ts = tot(mix.short), tl = tot(mix.long);
    const names = [...new Set([...Object.keys(mix.short), ...Object.keys(mix.long)])]
      .sort((a, b) => ((mix.short[b] || 0) + (mix.long[b] || 0)) - ((mix.short[a] || 0) + (mix.long[a] || 0)));
    const share = (m, t, k) => (t ? Math.round(((m[k] || 0) / t) * 100) + "%" : "–");
    $("sourcesTable").innerHTML = `<thead><tr><th class="l">Source</th><th>Shorts</th><th>Longs</th></tr></thead><tbody>` +
      names.map((k) => `<tr><td class="l">${esc(k)}</td><td>${share(mix.short, ts, k)}</td><td>${share(mix.long, tl, k)}</td></tr>`).join("") +
      `<tr><td class="l"><b>All views</b></td><td>${fmt(ts)}</td><td>${fmt(tl)}</td></tr></tbody>`;
  }

  // ---------------------------------------------------------------- videos
  const COLS = [
    ["publishedAt", "Published", "l"], ["title", "Title", "l"], ["format", "Format", "l"], ["views", "Views"], ["d1", "+1 day"], ["d7", "+7 days"], ["d30", "+30 days"], ["perDay", "Views/day"], ["apv", "Avg % viewed"], ["feedShareDay1", "Feed, day 1"], ["topSource28", "Top source", "l"], ["likes", "Likes"],
  ];
  function drawVideos(c) {
    const q = state.q.trim().toLowerCase();
    const val = (v, k) => (k === "apv" ? (v.last28 ? v.last28.avgViewPct : null) : v[k]);
    let vs = c.videos.filter((v) => (state.f === "all" || v.format === state.f) && (!q || v.title.toLowerCase().includes(q)));
    vs = vs.slice().sort((a, b) => {
      const x = val(a, state.sort), y = val(b, state.sort);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.dir;
    });
    const head = COLS.map(([k, label, a]) => `<th class="${a || ""}" aria-sort="${state.sort === k ? (state.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-sort="${k}">${label}${state.sort === k ? (state.dir > 0 ? " ↑" : " ↓") : ""}</button></th>`).join("");
    const body = vs.map((v) => `<tr>
      <td class="l">${v.publishedAt ? v.publishedAt.slice(0, 10) : "–"}</td>
      <td class="l title"><a href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a></td>
      <td class="l"><span class="pill ${v.format}">${v.format === "short" ? "Short" : "Long"}</span></td>
      <td>${fmt(v.views)}</td>
      <td class="delta ${cls(v.d1)}">${signed(v.d1)}</td><td class="delta ${cls(v.d7)}">${signed(v.d7)}</td><td class="delta ${cls(v.d30)}">${signed(v.d30)}</td>
      <td>${v.perDay == null ? "–" : v.perDay.toLocaleString("en-GB")}</td>
      <td>${v.last28 && v.last28.avgViewPct != null ? v.last28.avgViewPct.toFixed(0) + "%" : "–"}</td>
      <td title="Share of the first two days' views that came from the Shorts feed (50% or more means it was fed)">${v.feedShareDay1 == null ? "–" : `<span class="delta ${v.feedShareDay1 >= 50 ? "up" : "down"}">${v.feedShareDay1.toFixed(0)}%</span>`}</td>
      <td class="l">${v.topSource28 ? esc(v.topSource28) : "–"}</td>
      <td>${fmt(v.likes)}</td></tr>`).join("");
    $("videos").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body || `<tr><td class="l" colspan="${COLS.length}">No videos match.</td></tr>`}</tbody>`;
  }
  $("videos").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sort]"); if (!b) return;
    const k = b.dataset.sort;
    if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = ["title", "format", "topSource28"].includes(k) ? 1 : -1; }
    drawVideos(cur());
  });
  $("q").addEventListener("input", (e) => { state.q = e.target.value; drawVideos(cur()); });

  function seg(id, key, attr, cast) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      state[key] = cast ? cast(b.dataset[attr]) : b.dataset[attr];
      $(id).querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render();
    });
  }
  seg("range", "days", "days", Number);
  seg("period", "period", "p");
  seg("fmt", "f", "f");

  function render() {
    const c = cur();
    drawTabs(); drawReadout(c); drawDaily(c); drawPeriod(c); drawSources(c); drawVideos(c);
    $("notes").innerHTML = c.notes.map((n) => `<li>${esc(n)}</li>`).join("") + `<li>Growth figures are differences between daily snapshots taken each morning (London). Weeks run Monday to Sunday. A week or month still running is compared with the same number of days at the start of the one before, and is drawn lighter; no % is shown on a base under 20 views or 30 minutes.</li>`;
  }
  render();
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const c = cur(); drawDaily(c); drawPeriod(c); }, 150); });
})();
</script>

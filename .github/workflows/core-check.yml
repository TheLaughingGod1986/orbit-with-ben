name: Studio core check

# Shared tooling lives once (Ben, 15 Oct 2026: unify HOS and OWB, keep their own rules). studio-core/CORE_FILES.json
# locks every shared file by sha256 in both repos; editing one in a single repo fails here.
#
# When it runs (J2531, 10 Nov 2026, jobs/reviews/J2531/MINUTES.md): on pull requests, inside the Rules check's job (see below); on a push to main that
# changes something other than data (the queue, STATUS.md, a film's status.json, the analytics and board records);
# and once a day on main. A merged pull request is not checked a second time: its head ran this already.
on:
  push:
    branches: [main]
    paths-ignore: ["jobs/**", "JOBS.md", "STATUS.md", "02_Video-Projects/*/status.json", "05_Analytics/**"]
  # Pull requests (acting Chief, 10 Nov): this workflow's two steps run inside the Rules check's job
  # (rules-check.yml), which starts on every pull request that changes something other than data, so a pull request
  # pays for one job, not two. Only a pull request that changes this file runs it here, to prove the file loads.
  pull_request:
    paths: [".github/workflows/core-check.yml"]
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A skipped job uses no runner and no minutes.
    # The value is in double quotes on purpose: unquoted, YAML reads " #" as the start of a comment and cuts it in half.
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge pull request #') || contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/core_sync.py check
      - run: python3 -m unittest discover -s 00_Brand/Channel-Setup/tools -p "test_weekly_public_audit.py" -v

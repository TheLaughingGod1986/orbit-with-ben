name: Rules check

# AGENTS.md is the source of the sign-off order and the Never list. The copies in the always-on Cursor rule and
# the playbook are generated from it, and superseded wording is blocked, so the rules can't drift apart again.
on:
  push:
    branches: [main]
    paths: ["AGENTS.md", ".cursor/rules/**", "docs/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", "scripts/studio.py", "scripts/test_*.py", ".github/workflows/rules-check.yml"]
  pull_request:
    paths: ["AGENTS.md", ".cursor/rules/**", "docs/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", "scripts/studio.py", "scripts/test_*.py", ".github/workflows/rules-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_rules.py --check
      - run: python3 -m unittest discover -s scripts -p "test_*.py" -v

name: Rules check

# AGENTS.md is the source of the sign-off order and the Never list. The copies in the always-on Cursor rule and
# the playbook are generated from it, and superseded wording is blocked, so the rules can't drift apart again.
on:
  push:
    branches: [main]
    paths: ["AGENTS.md", ".cursor/rules/**", "docs/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", "scripts/studio.py", "scripts/test_*.py", "scripts/picture_qa.py", "scripts/terminal_loop.py", "scripts/fixtures/terminal_loop/**", "04_Audio/tools/vo_take.py", "04_Audio/tools/test_vo_take.py", "00_Brand/Channel-Setup/tools/gate_shorts_open.py", "00_Brand/Channel-Setup/tools/test_gate_background.py", "00_Brand/Channel-Setup/tools/test_gate_duration.py", "00_Brand/Channel-Setup/tools/gate_upcoming.py", "00_Brand/Channel-Setup/tools/test_gate_upcoming.py", "00_Brand/Channel-Setup/tools/testdata/**", "02_Video-Projects/*/status.json", "STATUS.md", ".github/workflows/rules-check.yml"]
  pull_request:
    paths: ["AGENTS.md", ".cursor/rules/**", "docs/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", "scripts/studio.py", "scripts/test_*.py", "scripts/picture_qa.py", "scripts/terminal_loop.py", "scripts/fixtures/terminal_loop/**", "04_Audio/tools/vo_take.py", "04_Audio/tools/test_vo_take.py", "00_Brand/Channel-Setup/tools/gate_shorts_open.py", "00_Brand/Channel-Setup/tools/test_gate_background.py", "00_Brand/Channel-Setup/tools/test_gate_duration.py", "00_Brand/Channel-Setup/tools/gate_upcoming.py", "00_Brand/Channel-Setup/tools/test_gate_upcoming.py", "00_Brand/Channel-Setup/tools/testdata/**", "02_Video-Projects/*/status.json", "STATUS.md", ".github/workflows/rules-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_rules.py --check
      - run: python3 scripts/studio.py status --check
      - name: Install media-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - run: python3 -m unittest discover -s 04_Audio/tools -p "test_vo_take.py" -v
      - run: python3 -m unittest discover -s 00_Brand/Channel-Setup/tools -p "test_gate_background.py" -v
      - run: python3 -m unittest discover -s 00_Brand/Channel-Setup/tools -p "test_gate_upcoming.py" -v
      - run: python3 -m unittest discover -s 00_Brand/Channel-Setup/tools -p "test_gate_duration.py" -v

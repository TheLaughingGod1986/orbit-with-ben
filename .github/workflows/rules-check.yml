name: Rules check

# AGENTS.md is the source of the sign-off order and the Never list. The copies in the always-on Cursor rule and
# the playbook are generated from it, and superseded wording is blocked, so the rules can't drift apart again.
#
# When it runs (J2531, 10 Nov 2026, jobs/reviews/J2531/MINUTES.md): a push that changes only STATUS.md or a film's
# status.json no longer starts it, as a push or as a pull request.
# `studio.py status --check` for those commits now runs once a day on main, with the whole suite. A merged pull
# request is not checked a second time on main: its head ran this already.
on:
  push:
    branches: [main]
    paths: ["AGENTS.md", ".cursor/rules/**", "docs/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", "scripts/studio.py", "scripts/test_*.py", "scripts/picture_qa.py", "scripts/terminal_loop.py", "scripts/fixtures/terminal_loop/**", "04_Audio/tools/vo_take.py", "04_Audio/tools/test_vo_take.py", "00_Brand/Channel-Setup/tools/gate_shorts_open.py", "00_Brand/Channel-Setup/tools/test_gate_background.py", "00_Brand/Channel-Setup/tools/test_gate_duration.py", "00_Brand/Channel-Setup/tools/gate_upcoming.py", "00_Brand/Channel-Setup/tools/test_gate_upcoming.py", "00_Brand/Channel-Setup/tools/testdata/**", ".github/workflows/rules-check.yml", "05_Analytics/kanban/board_site/**", "05_Analytics/kanban/*.html", "scripts/*.py", "scripts/*.cjs"]
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
  # Pull requests (acting Chief, 10 Nov): this is the one job a pull request pays for. It starts on any pull request
  # that changes something other than data, always runs the Studio core check's two steps, and runs the rules steps
  # only when the pull request touches the rules paths (the "scope" step below; same list as the push list above).
  # In the week to 10 Nov, 104 of 119 pull requests on the rules paths also changed other code, so two workflows
  # with two path lists would have charged most of them twice.
  # The board's pages live under 05_Analytics/kanban and are code, not data: the last two patterns put them back
  # after the folder is left out (a later pattern wins). Without them a pull request that changes only the board
  # would start no check at all.
  pull_request:
    paths: ["**", "!jobs/**", "!JOBS.md", "!STATUS.md", "!02_Video-Projects/*/status.json", "!05_Analytics/**", "05_Analytics/kanban/board_site/**", "05_Analytics/kanban/*.html"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A skipped job uses no runner and no minutes.
    # The value is in double quotes on purpose: unquoted, YAML reads " #" as the start of a comment and cuts it in half.
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge pull request #') || contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the scope step can compare a pull request's merge commit with its base.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Does this run need the rules steps? Always yes on a push, the daily run and the manual button. On a pull
      # request, yes when a changed file is on the rules paths. If the file list cannot be read or is empty, yes.
      # RULES_PATHS must say the same as the push path list at the top of this file.
      # A change to any script, or to the board's pages, is on the list: its tests are in this suite, and before
      # 10 Nov 2026 a pull request that changed a script without touching a test file ran none of them.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          RULES_PATHS: '^(AGENTS\.md$|\.cursor/rules/|docs/|00_Brand/Channel-Setup/STUDIO_PLAYBOOK\.md$|scripts/sync_rules\.py$|scripts/studio\.py$|scripts/test_[^/]*\.py$|scripts/picture_qa\.py$|scripts/terminal_loop\.py$|scripts/fixtures/terminal_loop/|04_Audio/tools/vo_take\.py$|04_Audio/tools/test_vo_take\.py$|00_Brand/Channel-Setup/tools/gate_shorts_open\.py$|00_Brand/Channel-Setup/tools/test_gate_background\.py$|00_Brand/Channel-Setup/tools/test_gate_duration\.py$|00_Brand/Channel-Setup/tools/gate_upcoming\.py$|00_Brand/Channel-Setup/tools/test_gate_upcoming\.py$|00_Brand/Channel-Setup/tools/testdata/|\.github/workflows/rules-check\.yml$|05_Analytics/kanban/board_site/|05_Analytics/kanban/[^/]*\.html$|scripts/[^/]*\.(py|cjs)$)'
        run: |
          rules=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD || true)
            echo "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Eq "$RULES_PATHS"; then
              rules=false
            fi
          fi
          echo "rules=$rules"
          echo "rules=$rules" >> "$GITHUB_OUTPUT"
      # The Studio core check's two steps (core-check.yml), so a pull request pays for one job, not two. This is the
      # first; the second is the last step of this job (rules runs) or the step after this one (other runs).
      - run: python3 scripts/core_sync.py check
      - if: steps.scope.outputs.rules != 'true'
        run: python3 -m unittest discover -s 00_Brand/Channel-Setup/tools -p "test_weekly_public_audit.py" -v
      - if: steps.scope.outputs.rules == 'true'
        run: python3 scripts/sync_rules.py --check
      - if: steps.scope.outputs.rules == 'true'
        run: python3 scripts/studio.py status --check
      - name: Cache media-test tools
        if: steps.scope.outputs.rules == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-bundle
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v2
      - name: Install media-test tools
        if: steps.scope.outputs.rules == 'true'
        # J2538 (10 Nov 2026): cache the Ubuntu ffmpeg/ffprobe binaries and every resolved shared library (`ldd` with
        # `cp -L`, so update-alternatives links such as libblas/liblapack are stored as real files). On a cache hit
        # this restores in ~1 s instead of paying 12-22 s for apt-get + dpkg.
        # Only libraries the runner does not already have are added: the bundle also holds libc and other system
        # libraries, and writing over one that running programs have open can crash them. If the restored copy does
        # not answer, it is removed and the package is installed as before, so the tests never run without ffmpeg.
        run: |
          if [ -x ~/.cache/ffmpeg-bundle/bin/ffmpeg ] && [ -x ~/.cache/ffmpeg-bundle/bin/ffprobe ]; then
            sudo cp -a ~/.cache/ffmpeg-bundle/bin/ffmpeg ~/.cache/ffmpeg-bundle/bin/ffprobe /usr/local/bin/
            added=0
            for lib in ~/.cache/ffmpeg-bundle/lib/*; do
              if [ ! -e "/usr/lib/x86_64-linux-gnu/$(basename "$lib")" ]; then
                sudo cp -a "$lib" /usr/lib/x86_64-linux-gnu/
                added=$((added + 1))
              fi
            done
            echo "restored ffmpeg from the cache: $added libraries added"
            sudo ldconfig
          fi
          if ! (command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && ffmpeg -version >/dev/null 2>&1 && ffprobe -version >/dev/null 2>&1); then
            sudo rm -f /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            hash -r
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get install -y --no-install-recommends ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
            rm -rf ~/.cache/ffmpeg-bundle
            mkdir -p ~/.cache/ffmpeg-bundle/bin ~/.cache/ffmpeg-bundle/lib
            cp -L "$(command -v ffmpeg)" "$(command -v ffprobe)" ~/.cache/ffmpeg-bundle/bin/
            ldd ~/.cache/ffmpeg-bundle/bin/ffmpeg ~/.cache/ffmpeg-bundle/bin/ffprobe | awk '/=> \// {print $3}' | sort -u | xargs -r -I{} cp -L "{}" ~/.cache/ffmpeg-bundle/lib/
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      # Every test file in the three folders, not a hand-kept list: test_orbit_cfr_delivery.py and test_gate_stayed.py
      # were never run here until J2463 (7 Nov code audit, row F-05a).
      # J2538: split scripts/ across four parallel processes and 00_Brand/Channel-Setup/tools across three, with an
      # explicit partition check before running that every test_*.py file on disk is in exactly one group.
      - name: Tests (parallel groups, partition-checked)
        if: steps.scope.outputs.rules == 'true'
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys, time

          def make_groups(folder, n, heavy):
              all_mods = sorted(os.path.basename(p)[:-3] for p in glob.glob(f"{folder}/test_*.py"))
              if not all_mods:
                  raise SystemExit(f"no test_*.py files found in {folder}")
              pinned = {m for g in heavy.values() for m in g}
              groups = [[m for m in heavy.get(i, []) if m in all_mods] for i in range(n)]
              rest = [m for m in all_mods if m not in pinned]
              for idx, m in enumerate(rest):
                  target = min(range(n), key=lambda i: (len(groups[i]), i))
                  groups[target].append(m)
              flat = [m for g in groups for m in g]
              if len(flat) != len(all_mods) or len(set(flat)) != len(all_mods) or sorted(flat) != all_mods:
                  raise SystemExit(f"partition check failed for {folder}: grouped={len(flat)} unique={len(set(flat))} disk={len(all_mods)}")
              print(f"partition OK: {folder} ({len(all_mods)} files -> {[len(g) for g in groups]})", flush=True)
              return groups

          scripts_heavy = {
              0: ["test_chief_relay", "test_studio_split", "test_terminal_loop"],
              1: ["test_analytics_snapshot_sh", "test_mini_repair"],
              2: ["test_macbook_worker", "test_capability_probe", "test_sfx_kit"],
              3: ["test_metadata_git", "test_email_ratchet", "test_chief_succession", "test_board_benauth"],
          }
          tools_heavy = {
              0: ["test_gate_stayed"],
              1: ["test_gate_full_bleed"],
              2: ["test_gate_background"],
          }

          runs = []
          for idx, grp in enumerate(make_groups("scripts", 4, scripts_heavy), 1):
              runs.append((f"scripts-{idx}", "scripts", grp))
          for idx, grp in enumerate(make_groups("04_Audio/tools", 1, {}), 1):
              runs.append(("audio", "04_Audio/tools", grp))
          for idx, grp in enumerate(make_groups("00_Brand/Channel-Setup/tools", 3, tools_heavy), 1):
              runs.append((f"tools-{idx}", "00_Brand/Channel-Setup/tools", grp))

          procs = []
          for label, folder, mods in runs:
              log_path = f"/tmp/tests_{label}.log"
              env = dict(os.environ, PYTHONPATH=folder + (os.pathsep + os.environ["PYTHONPATH"] if os.environ.get("PYTHONPATH") else ""))
              fh = open(log_path, "w")
              p = subprocess.Popen([sys.executable, "-m", "unittest", "-v", *mods], stdout=fh, stderr=subprocess.STDOUT, env=env)
              procs.append((label, log_path, fh, p, time.monotonic()))

          rc = 0
          for label, log_path, fh, p, t0 in procs:
              code = p.wait()
              dt = time.monotonic() - t0
              fh.close()
              if code != 0:
                  rc = 1
              with open(log_path) as rf:
                  body = rf.read()
              print(f"::group::{label} ({dt:.1f}s, exit {code})")
              print(body, end="" if body.endswith("\n") else "\n")
              print("::endgroup::")
              for line in body.strip().splitlines()[-4:]:
                  print(f"[{label}] {line}")
          sys.exit(rc)
          PY

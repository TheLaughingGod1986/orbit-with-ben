name: Notes check

# The board's film notes are pushed straight to main, about once an hour, and no other workflow watches that file.
# On 10 Nov 2026 a notes push left main red for 85 minutes before anything noticed. This runs the same checks the
# push script runs (scripts/notes_push.py --check): the file's form, the fields the board draws, and every test
# that reads the notes. It takes a few seconds.
#
# When it runs (J2531, 10 Nov 2026, jobs/reviews/J2531/MINUTES.md): a push of the notes file alone no longer starts
# it, because scripts/notes_push.py runs these same checks before it pushes. It runs on pull requests and pushes
# that change the script or this file, and once a day on main.
on:
  push:
    branches: [main]
    paths: ["scripts/notes_push.py", ".github/workflows/notes-check.yml"]
  pull_request:
    # The notes file itself is data: a pull request that changes only data starts no workflow (acting Chief, 10 Nov).
    paths: ["scripts/notes_push.py", ".github/workflows/notes-check.yml"]
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notes:
    # A skipped job uses no runner and no minutes. A merged pull request ran this on its head already.
    # The value is in double quotes on purpose: unquoted, YAML reads " #" as the start of a comment and cuts it in half.
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge pull request #') || contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/notes_push.py --check

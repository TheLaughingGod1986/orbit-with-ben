name: Content Ops checks

# Every push or PR that touches the local CLIs (Buffer mirror, YouTube upload, gates) runs the
# same checks a contributor runs locally, so a broken merge is caught before the Mac's 07:05 run.
#
# J2531 (10 Nov 2026, jobs/reviews/J2531/MINUTES.md): a merged pull request is not checked a second time on main,
# its head ran this already; one run a day on main (04:40 UTC, before the 07:05 run) catches anything else.
on:
  push:
    branches: [main]
    paths: ["07_Content-Ops/**", ".github/workflows/content-ops.yml"]
  pull_request:
    paths: ["07_Content-Ops/**", ".github/workflows/content-ops.yml"]
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A skipped job uses no runner and no minutes.
    # The value is in double quotes on purpose: unquoted, YAML reads " #" as the start of a comment and cuts it in half.
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Merge pull request #') || contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_Content-Ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 07_Content-Ops/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
